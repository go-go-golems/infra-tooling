name: publish-goreleaser-release

on:
  workflow_call:
    inputs:
      linux_artifact:
        required: true
        type: string
      darwin_artifact:
        required: true
        type: string
      goreleaser_config:
        required: false
        type: string
        default: .goreleaser.yaml
      credential_profile:
        required: true
        type: string
      vault_role:
        required: true
        type: string
      vault_addr:
        required: false
        type: string
        default: https://vault.yolo.scapegoat.dev
      vault_auth_path:
        required: false
        type: string
        default: github-actions
      vault_audience:
        required: false
        type: string
        default: https://vault.yolo.scapegoat.dev
      release_environment:
        required: false
        type: string
        default: release

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_environment }}

    steps:
      - name: Resolve approved credential profile
        id: profile
        shell: bash
        env:
          CREDENTIAL_PROFILE: ${{ inputs.credential_profile }}
        run: |
          set -euo pipefail
          case "${CREDENTIAL_PROFILE}" in
            homebrew-fury)
              homebrew_owner=go-go-golems
              homebrew_repository=homebrew-go-go-go
              goreleaser_secret=kv/data/ci/release/shared/goreleaser-pro
              homebrew_app_secret=kv/data/ci/github/homebrew-go-go-go/release-publisher-app
              fury_secret=kv/data/ci/release/shared/fury-go-go-golems
              signing=none
              ;;
            hyperslop-homebrew-fury-gpg)
              homebrew_owner=hyperslop-systems
              homebrew_repository=homebrew
              goreleaser_secret=kv/data/ci/release/shared/goreleaser-pro
              homebrew_app_secret=kv/data/ci/github/hyperslop-systems/homebrew-publisher-app
              fury_secret=kv/data/ci/release/hyperslop-systems/fury
              signing=gpg
              ;;
            *)
              echo "unsupported credential_profile: ${CREDENTIAL_PROFILE}" >&2
              exit 1
              ;;
          esac

          {
            echo "homebrew_owner=${homebrew_owner}"
            echo "homebrew_repository=${homebrew_repository}"
            echo "goreleaser_secret=${goreleaser_secret}"
            echo "homebrew_app_secret=${homebrew_app_secret}"
            echo "fury_secret=${fury_secret}"
            echo "signing=${signing}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate publication contract
        shell: bash
        env:
          LINUX_ARTIFACT: ${{ inputs.linux_artifact }}
          DARWIN_ARTIFACT: ${{ inputs.darwin_artifact }}
          GORELEASER_CONFIG: ${{ inputs.goreleaser_config }}
          VAULT_ROLE: ${{ inputs.vault_role }}
        run: |
          set -euo pipefail
          for artifact in "${LINUX_ARTIFACT}" "${DARWIN_ARTIFACT}"; do
            if [[ ! "${artifact}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "artifact names must be simple GitHub artifact identifiers" >&2
              exit 1
            fi
          done
          if [[ "${GORELEASER_CONFIG}" = /* || "${GORELEASER_CONFIG}" = *".."* ]]; then
            echo "goreleaser_config must be a relative repository path without .." >&2
            exit 1
          fi
          test -n "${VAULT_ROLE}"

      - name: Check out caller repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify GoReleaser configuration
        shell: bash
        env:
          GORELEASER_CONFIG: ${{ inputs.goreleaser_config }}
        run: test -f "${GORELEASER_CONFIG}"

      - name: Download Linux split artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.linux_artifact }}
          path: dist-parts/linux

      - name: Download Darwin split artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.darwin_artifact }}
          path: dist-parts/darwin

      - name: Merge split artifact directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for part in linux darwin; do
            if [ -d "dist-parts/${part}/dist" ]; then
              cp -a "dist-parts/${part}/dist/." dist/
            else
              cp -a "dist-parts/${part}/." dist/
            fi
          done
          test -n "$(find dist -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Read Vault-backed publisher credentials
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          path: ${{ inputs.vault_auth_path }}
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: ${{ inputs.vault_audience }}
          exportToken: true
          secrets: |
            ${{ steps.profile.outputs.goreleaser_secret }} license_key | GORELEASER_KEY ;
            ${{ steps.profile.outputs.homebrew_app_secret }} app_id | HOMEBREW_APP_ID ;
            ${{ steps.profile.outputs.homebrew_app_secret }} private_key | HOMEBREW_APP_PRIVATE_KEY ;
            ${{ steps.profile.outputs.fury_secret }} token | FURY_TOKEN ;

      - name: Read GPG signing credentials
        if: steps.profile.outputs.signing == 'gpg'
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          path: ${{ inputs.vault_auth_path }}
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: ${{ inputs.vault_audience }}
          secrets: |
            kv/data/ci/release/hyperslop-systems/gpg-signing private_key | GPG_PRIVATE_KEY ;
            kv/data/ci/release/hyperslop-systems/gpg-signing passphrase | GPG_PASSPHRASE ;

      - name: Mask publisher credentials
        shell: bash
        env:
          GORELEASER_KEY: ${{ env.GORELEASER_KEY }}
          HOMEBREW_APP_ID: ${{ env.HOMEBREW_APP_ID }}
          HOMEBREW_APP_PRIVATE_KEY: ${{ env.HOMEBREW_APP_PRIVATE_KEY }}
          FURY_TOKEN: ${{ env.FURY_TOKEN }}
          GPG_PRIVATE_KEY: ${{ env.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
          SIGNING: ${{ steps.profile.outputs.signing }}
        run: |
          set -euo pipefail
          for value in "${GORELEASER_KEY}" "${HOMEBREW_APP_ID}" "${HOMEBREW_APP_PRIVATE_KEY}" "${FURY_TOKEN}"; do
            test -n "${value}"
            echo "::add-mask::${value}"
          done
          if [[ "${SIGNING}" = gpg ]]; then
            for value in "${GPG_PRIVATE_KEY}" "${GPG_PASSPHRASE}"; do
              test -n "${value}"
              echo "::add-mask::${value}"
            done
          fi

      - name: Import GPG signing key
        id: import_gpg
        if: steps.profile.outputs.signing == 'gpg'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}
          fingerprint: 6EBE1DF0BDF48A1BBA381B5B79983EF218C6ED7E

      - name: Mint Homebrew publisher App token
        id: homebrew-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.HOMEBREW_APP_ID }}
          private-key: ${{ env.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ steps.profile.outputs.homebrew_owner }}
          repositories: ${{ steps.profile.outputs.homebrew_repository }}

      - name: Export Homebrew publisher token
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${{ steps.homebrew-app-token.outputs.token }}"
          echo "TAP_GITHUB_TOKEN=${{ steps.homebrew-app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Publish merged release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: continue --merge --config=${{ inputs.goreleaser_config }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_KEY: ${{ env.GORELEASER_KEY }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          TAP_GITHUB_TOKEN: ${{ env.TAP_GITHUB_TOKEN }}
          FURY_TOKEN: ${{ env.FURY_TOKEN }}
